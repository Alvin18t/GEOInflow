name: Liekan compatibility checks
on:
  push:
    branches: [main, 'feature/**', 'upstream-sync/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
      SKIP_DB_CHECK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node --test tests/liekan/docker-context.test.mjs
      - run: pnpm liekan:verify --source-only
